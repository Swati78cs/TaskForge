version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: taskforge-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: taskforge-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: taskforge-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/taskforge
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=production_super_secret_jwt_key_32chars_min
      - JWT_REFRESH_SECRET=production_super_secret_refresh_jwt_key_32chars
      - WORKER_CONCURRENCY=5
      - LOCK_DURATION=30000
    depends_on:
      - mongodb
      - redis
    command: npm start

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: taskforge-worker
    restart: always
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/taskforge
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_CONCURRENCY=5
      - LOCK_DURATION=30000
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
    depends_on:
      - mongodb
      - redis
    command: npm run worker

  scheduler:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: taskforge-scheduler
    restart: always
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/taskforge
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongodb
      - redis
    command: npm run scheduler

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: taskforge-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongo_data: